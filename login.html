<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Blood Bank</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            🩸 Blood Bank
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#about">About</a>
            </li>

            <li>
                <a href="index.html#availability">
                    Blood Availability
                </a>
            </li>

            <li>
                <a href="donor.html">Donate Blood</a>
            </li>

            <li>
                <a href="request.html">Request Blood</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

        </ul>

    </nav>


    <!-- Login Section -->

    <section class="form-section">

        <div class="form-container">

            <h1>Login</h1>

            <p>
                Login to access your Blood Bank account.
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn"
                >
                    Login
                </button>


            </form>


            <!-- Register Link -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Blood Bank Management System
        </p>

    </footer>


    <!-- Login JavaScript -->

    <script src="js/login.js"></script>


</body>

</html>
