<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Blood - Blood Bank</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🩸 Blood Bank
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#availability">Blood Availability</a></li>
            <li><a href="donor.html">Donate Blood</a></li>
            <li><a href="request.html">Request Blood</a></li>
        </ul>

    </nav>


    <!-- Blood Request Form -->
    <section class="form-section">

        <div class="form-container">

            <h1>Request Blood</h1>

            <p>Submit a request for blood.</p>


            <form id="requestForm">

                <!-- Patient Name -->
                <label for="patientName">Patient Name</label>

                <input
                    type="text"
                    id="patientName"
                    name="patientName"
                    placeholder="Enter patient name"
                    required
                >


                <!-- Blood Group -->
                <label for="bloodGroup">Blood Group</label>

                <select id="bloodGroup" name="bloodGroup" required>

                    <option value="">Select Blood Group</option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                </select>


                <!-- Required Units -->
                <label for="requiredUnits">Required Units</label>

                <input
                    type="number"
                    id="requiredUnits"
                    name="requiredUnits"
                    min="1"
                    placeholder="Enter required units"
                    required
                >


                <!-- Hospital Name -->
                <label for="hospitalName">Hospital Name</label>

                <input
                    type="text"
                    id="hospitalName"
                    name="hospitalName"
                    placeholder="Enter hospital name"
                    required
                >


                <!-- Contact Number -->
                <label for="contactNumber">Contact Number</label>

                <input
                    type="tel"
                    id="contactNumber"
                    name="contactNumber"
                    placeholder="Enter contact number"
                    required
                >


                <!-- Email -->
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >


                <!-- Required Date -->
                <label for="requiredDate">Required Date</label>

                <input
                    type="date"
                    id="requiredDate"
                    name="requiredDate"
                    required
                >


                <!-- Reason -->
                <label for="reason">Reason</label>

                <textarea
                    id="reason"
                    name="reason"
                    rows="4"
                    placeholder="Enter reason for blood request"
                    required
                ></textarea>


                <!-- Submit -->
                <button type="submit" class="btn">
                    Submit Blood Request
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>© 2026 Blood Bank Management System</p>

    </footer>


    <!-- JavaScript -->
    <script src="js/request.js"></script>

</body>

</html>
