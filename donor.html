<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration - Blood Bank</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🩸 Blood Bank
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#availability">Blood Availability</a></li>
            <li><a href="donor.html">Donate Blood</a></li>
        </ul>

    </nav>


    <!-- Donor Registration -->
    <section class="form-section">

        <div class="form-container">

            <h1>Donor Registration</h1>

            <p>Register yourself as a blood donor.</p>


            <form id="donorForm">

                <!-- Full Name -->
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Age -->
                <label for="age">Age</label>

                <input
                    type="text"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    required
                >


                <!-- Gender -->
                <label for="gender">Gender</label>

                <select id="gender" name="gender" required>

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Other">Other</option>

                </select>


                <!-- Blood Group -->
                <label for="bloodGroup">Blood Group</label>

                <select id="bloodGroup" name="bloodGroup" required>

                    <option value="">Select Blood Group</option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                </select>


                <!-- Mobile Number -->
                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter mobile number"
                    required
                >


                <!-- Email -->
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >


                <!-- Address -->
                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your address"
                    required
                ></textarea>


                <!-- Last Donation Date -->
                <label for="lastDonationDate">
                    Last Donation Date
                </label>

                <input
                    type="date"
                    id="lastDonationDate"
                    name="lastDonationDate"
                >


                <!-- Submit Button -->
                <button type="submit" class="btn">
                    Register as Donor
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Blood Bank Management System
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
