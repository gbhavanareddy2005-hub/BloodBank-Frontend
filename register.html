<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Blood Bank</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🩸 Blood Bank
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#availability">Blood Availability</a></li>
            <li><a href="donor.html">Donate Blood</a></li>
            <li><a href="request.html">Request Blood</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>


    <!-- Registration Form -->
    <section class="form-section">

        <div class="form-container">

            <h1>Create Account</h1>

            <p>Register for the Blood Bank system.</p>

            <form id="registerForm">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="mobile">Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    required
                >


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <button type="submit" class="btn">
                    Register
                </button>

            </form>

        </div>

    </section>


    <footer>
        <p>© 2026 Blood Bank Management System</p>
    </footer>


    <script src="js/register.js"></script>

</body>

</html>
